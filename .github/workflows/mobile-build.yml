      - name: Run dependency lifecycle scripts without private credentials
        run: |
          npm rebuild --no-audit --no-fund

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate icons + splash
        run: |
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#0a0a0f' --iconBackgroundColorDark '#0a0a0f' --splashBackgroundColor '#0a0a0f' --splashBackgroundColorDark '#0a0a0f'

      - name: Inject release signing config
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          cat > android/app/signing.gradle << 'GRADLE_EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("PURAMA_KEYSTORE_PATH"))
                      storePassword System.getenv("PURAMA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("PURAMA_KEY_ALIAS")
                      keyPassword System.getenv("PURAMA_KEY_PASSWORD")
                      // v1 explicite: certains minSdk/AGP récents désactivent le schéma v1
                      // par défaut, ce qui rend l'APK invisible à jarsigner/unzip (mais
                      // valide via v2/v3). On force les deux pour rester détectable par
                      // les deux méthodes de vérif.
                      enableV1Signing true
                      enableV2Signing true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE_EOF
          echo "" >> android/app/build.gradle
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle

      - name: Decode keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/purama-mobile-release.jks"

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        working-directory: yatra/android
        env:
          PURAMA_KEYSTORE_PATH: ${{ runner.temp }}/purama-mobile-release.jks
          PURAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PURAMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PURAMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK is signed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK" || (echo "APK NOT SIGNED (apksigner)" && exit 1)
          else
            unzip -l "$APK" | grep -i "META-INF/.*\.\(RSA\|SF\)" || (echo "APK NOT SIGNED (v1 fallback check)" && exit 1)
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        with:
          name: yatra-android-release-apk
          path: yatra/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build unsigned release APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sign_release || github.ref != 'refs/heads/main' }}
        working-directory: yatra/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload unsigned validation APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sign_release || github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: yatra-android-unsigned-validation
          path: yatra/android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Android signing material
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: rm -f -- "$RUNNER_TEMP/purama-mobile-release.jks"

